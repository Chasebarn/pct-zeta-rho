<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@700&display=swap" rel="stylesheet"><style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1200px; height:320px; overflow:hidden; }
.art { position:relative; width:1200px; height:320px; overflow:hidden;
  background: radial-gradient(52% 78% at 30% 34%, #3a2456 0%, transparent 66%), #241733; }
.inner { position:relative; z-index:2; height:100%; display:flex; flex-direction:column;
  align-items:center; text-align:center; padding:46px 70px 0; }
.rule { width:88px; height:4px; background:#c9a227; }
h1 { font-family:"Instrument Serif",serif; font-weight:400; font-size:84px; line-height:1.05;
  color:#faf8f3; margin-top:34px; }
h1 em { font-style:italic; color:#e6c65b; }
.meta { font-family:Inter,sans-serif; font-weight:700; font-size:23px; letter-spacing:7px;
  text-indent:7px; color:#b9aecb; text-transform:uppercase; margin-top:34px; }
.flat { position:absolute; left:0; right:0; bottom:0; height:60px;
  background:linear-gradient(transparent, #241733 85%); z-index:3; }
</style></head><body><div class="art"><div class="inner">
<div class="rule"></div><h1 id="h"></h1><div class="meta" id="m"></div>
</div><div class="flat"></div></div>
<script>
var q = new URLSearchParams(location.search);
document.getElementById('h').innerHTML = q.get('title') || 'We&rsquo;ll see you <em>there.</em>';
var m = q.get('meta');
if (m) { document.getElementById('m').innerHTML = m; } else { document.getElementById('m').style.display = 'none'; }
var h = document.getElementById('h'), s = 84;
while (h.scrollHeight > 200 && s > 44) { s -= 4; h.style.fontSize = s + 'px'; }
</script></body></html>
