<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>Thanks for coming.</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!--[if gte mso 9]><xml><o:OfficeDocumentSettings>
    <o:AllowPNG/><o:PixelsPerInch>96</o:PixelsPerInch>
  </o:OfficeDocumentSettings></xml><![endif]-->
  <!--
    POST EVENT FOLLOW UP  (send the morning after any rush event)
    SUBJECT:      Thanks for coming.
    PREVIEW TEXT: Photos, and what is next.

    This mock is filled with realistic sample content. Every value below is real
    sample copy, not a placeholder, so it previews the way it will send. Swap the
    four things named in the region comments and it is ready.

    THE FOUR SWAPS:
      1. INTRO      name the event that just happened.
      2. PHOTOS     two mock boxes. Drop in two photos from THAT event, or delete
                    both the PHOTOS label tr and the photo tr before sending.
      3. UP NEXT    the sub-line names the next event, and the grid carries its
                    four facts. Those facts appear in the grid and NOWHERE else.
      4. CTA        confirm the rush schedule page is live.

    NOTES:
      - The hero and the closing art are name-only. They carry no date, time or
        room, so nothing in this email restates the grid.
      - Baked art is cached by URL on GitHub Pages forever. If you re-render a
        PNG, save it under a NEW filename.
      - Sample dates assume Fall Rush 2026, where Sep 2 is a Wednesday (Info
        Night) and Sep 4 is a Friday (Workshop). The source flyer says 2025,
        where those fall on Tuesday and Thursday. Confirm before any real send.
  -->
</head>
<body style="margin:0; padding:0; background-color:#f4f1ea; -webkit-text-size-adjust:100%;">

  <div style="display:none; max-height:0; overflow:hidden; mso-hide:all;">
    Photos, and what is next.&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f1ea;">
    <tr>
      <td align="center" style="padding:26px 12px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:600px; max-width:100%; background-color:#ffffff;">

          <!-- HERO · name only. Reads "PCT Fall Rush / Thank you." Never carries a date. -->
          <tr>
            <td bgcolor="#241733" style="background-color:#241733; padding:0;">
              <img src="https://chasebarn.github.io/pct-zeta-rho/assets/email-art/hn-thanks.png"
                   width="600" height="150" alt="PCT Fall Rush. Thank you."
                   style="display:block; width:100%; height:auto; font-family:Georgia,serif; font-size:18px; line-height:1.5; color:#faf8f3; background-color:#241733;">
            </td>
          </tr>

          <!-- INTRO · SWAP: name the event that just happened. -->
          <tr>
            <td bgcolor="#faf8f3" style="background-color:#faf8f3; padding:42px 44px 0;">
              <div style="font-family:'Inter','Helvetica Neue',Helvetica,'Segoe UI',sans-serif; font-size:18px; font-weight:400; line-height:1.6; color:#453a52;">
                Thanks for coming to Info Night. It was a good room.
              </div>
            </td>
          </tr>

          <!-- PHOTOS · label -->
          <tr>
            <td bgcolor="#faf8f3" style="background-color:#faf8f3; padding:44px 44px 0;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr><td bgcolor="#faf8f3" style="background-color:#faf8f3; border-bottom:1px solid #e8e2d4; padding-bottom:12px; font-family:'Inter','Helvetica Neue',Helvetica,'Segoe UI',sans-serif; font-size:12px; font-weight:700; color:#8a6d14; text-transform:uppercase;">Photos</td></tr>
              </table>
            </td>
          </tr>

          <!-- PHOTOS · SWAP: two photos from the event that just happened.
               Each box is 50% with a 12px gutter. Replace both, or delete this tr
               and the PHOTOS label tr above it before sending. -->
          <tr>
            <td bgcolor="#faf8f3" style="background-color:#faf8f3; padding:22px 44px 44px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td width="50%" valign="top" style="padding:0 6px 0 0;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#efe9dc" style="background-color:#efe9dc;">
                      <tr><td align="center" bgcolor="#efe9dc" style="background-color:#efe9dc; padding:64px 12px; font-family:'Inter','Helvetica Neue',Helvetica,'Segoe UI',sans-serif; font-size:12px; font-weight:700; color:#6e6552; text-transform:uppercase;">
                        Image placeholder
                      </td></tr>
                    </table>
                  </td>
                  <td width="50%" valign="top" style="padding:0 0 0 6px;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#efe9dc" style="background-color:#efe9dc;">
                      <tr><td align="center" bgcolor="#efe9dc" style="background-color:#efe9dc; padding:64px 12px; font-family:'Inter','Helvetica Neue',Helvetica,'Segoe UI',sans-serif; font-size:12px; font-weight:700; color:#6e6552; text-transform:uppercase;">
                        Image placeholder
                      </td></tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- UP NEXT · label, and the sub-line that names the next event. -->
          <tr>
            <td bgcolor="#faf8f3" style="background-color:#faf8f3; padding:44px 44px 0;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr><td bgcolor="#faf8f3" style="background-color:#faf8f3; border-bottom:1px solid #e8e2d4; padding-bottom:12px; font-family:'Inter','Helvetica Neue',Helvetica,'Segoe UI',sans-serif; font-size:12px; font-weight:700; color:#8a6d14; text-transform:uppercase;">Up next</td></tr>
              </table>
              <div style="font-family:'Inter','Helvetica Neue',Helvetica,'Segoe UI',sans-serif; font-size:15px; font-weight:400; line-height:1.6; color:#453a52; padding-top:14px;">
                The Professional Workshop.
              </div>
            </td>
          </tr>

          <!-- UP NEXT · SWAP: the four facts for the next event. This grid is the
               ONLY place they appear. Nothing above or below restates them. -->
          <tr>
            <td bgcolor="#faf8f3" style="background-color:#faf8f3; padding:30px 44px 44px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#f2eee4" style="background-color:#f2eee4;">
                <tr>
                  <td width="50%" valign="top" style="padding:30px 16px 22px 30px; border-bottom:1px solid #e2dac6;">
                    <div style="font-family:'Inter','Helvetica Neue',Helvetica,'Segoe UI',sans-serif; font-size:11px; font-weight:700; color:#8a6d14; text-transform:uppercase;">Date</div>
                    <div style="font-family:'Instrument Serif',Georgia,serif; font-size:27px; line-height:1.2; color:#191221; padding-top:7px;">Friday,<br>September&nbsp;4</div>
                  </td>
                  <td width="50%" valign="top" style="padding:30px 30px 22px 16px; border-bottom:1px solid #e2dac6; border-left:1px solid #e2dac6;">
                    <div style="font-family:'Inter','Helvetica Neue',Helvetica,'Segoe UI',sans-serif; font-size:11px; font-weight:700; color:#8a6d14; text-transform:uppercase;">Time</div>
                    <div style="font-family:'Instrument Serif',Georgia,serif; font-size:27px; line-height:1.2; color:#191221; padding-top:7px;">7:00&nbsp;PM</div>
                  </td>
                </tr>
                <tr>
                  <td width="50%" valign="top" style="padding:22px 16px 30px 30px;">
                    <div style="font-family:'Inter','Helvetica Neue',Helvetica,'Segoe UI',sans-serif; font-size:11px; font-weight:700; color:#8a6d14; text-transform:uppercase;">Room</div>
                    <div style="font-family:'Instrument Serif',Georgia,serif; font-size:27px; line-height:1.2; color:#191221; padding-top:7px;">BSN&nbsp;225</div>
                    <div style="font-family:'Inter','Helvetica Neue',Helvetica,'Segoe UI',sans-serif; font-size:13px; color:#6f6580; padding-top:5px;">Muma College of Business</div>
                  </td>
                  <td width="50%" valign="top" style="padding:22px 30px 30px 16px; border-left:1px solid #e2dac6;">
                    <div style="font-family:'Inter','Helvetica Neue',Helvetica,'Segoe UI',sans-serif; font-size:11px; font-weight:700; color:#8a6d14; text-transform:uppercase;">Attire</div>
                    <div style="font-family:'Instrument Serif',Georgia,serif; font-size:27px; line-height:1.2; color:#191221; padding-top:7px;">Business<br>casual</div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- PRIMARY CTA · the only CTA in this email. Baked gold button on the
               purple band. SWAP: confirm the rush schedule page is live. -->
          <tr>
            <td bgcolor="#241733" style="background-color:#241733; padding:0;">
              <a href="https://chasebarn.github.io/pct-zeta-rho/fallrush.html" style="display:block;">
                <img src="https://chasebarn.github.io/pct-zeta-rho/assets/email-art/btn-schedule1.png" width="600" height="95"
                     alt="View the rush schedule"
                     style="display:block; width:100%; height:auto; border:0; font-family:Helvetica,'Segoe UI',sans-serif; font-size:14px; font-weight:bold; color:#c9a227; background-color:#241733;">
              </a>
            </td>
          </tr>

          <!-- CLOSE -->
          <tr>
            <td bgcolor="#241733" style="background-color:#241733; padding:0;">
              <img src="https://chasebarn.github.io/pct-zeta-rho/assets/email-art/cx-next-event.png" width="600" height="130"
                   alt="See you at the next one."
                   style="display:block; width:100%; height:auto; font-family:Georgia,serif; font-size:18px; line-height:1.5; color:#faf8f3; background-color:#241733;">
            </td>
          </tr>

          <!-- FOOTER -->
          <tr>
            <td bgcolor="#241733" style="background-color:#241733; padding:0;">
              <img src="https://chasebarn.github.io/pct-zeta-rho/assets/email-art/footer-art2.png" width="600" height="150"
                   alt="Phi Chi Theta at USF"
                   style="display:block; width:100%; height:auto; font-family:Georgia,serif; font-size:16px; color:#faf8f3; background-color:#241733;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>
                <td width="50%" style="padding:0;"><a href="https://chasebarn.github.io/pct-zeta-rho/" style="display:block;"><img src="https://chasebarn.github.io/pct-zeta-rho/assets/email-art/footer-web1.png" width="300" height="65" alt="Visit our website" style="display:block; width:100%; height:auto; border:0; font-family:Helvetica,'Segoe UI',sans-serif; font-size:12px; font-weight:bold; color:#faf8f3; background-color:#241733;"></a></td>
                <td width="50%" style="padding:0;"><a href="https://www.instagram.com/pctusf/" style="display:block;"><img src="https://chasebarn.github.io/pct-zeta-rho/assets/email-art/footer-ig1.png" width="300" height="65" alt="@pctusf on Instagram" style="display:block; width:100%; height:auto; border:0; font-family:Helvetica,'Segoe UI',sans-serif; font-size:12px; font-weight:bold; color:#faf8f3; background-color:#241733;"></a></td>
              </tr></table>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
