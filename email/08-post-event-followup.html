  <!--
    PCT FALL RUSH · POST EVENT FOLLOW UP · reusable after any rush event

    SUBJECT:      Thanks for coming.
    PREVIEW TEXT: Photos below, and what is up next.

    ✎ EDIT BEFORE SENDING
      1. ✎ [EVENT NAME] appears once, in the opening line. Set it to the event
         that just ran.
      2. ✎ HERO ART. This build ships hero-info-night.png. Swap the filename to
         the matching hero for whichever event just ran:
         hero-info-night.png, hero-workshop.png, hero-alumni-panel.png,
         hero-phi-chi-fest.png, hero-quick-queue.png, hero-invite-only.png.
         Rewrite the alt line to match the art.
      3. ✎ PHOTOS. The two grey boxes are intentional placeholders. Replace them
         with photos from THIS event only. If there are none, leave the boxes.
      4. ✎ UP NEXT card. Replace [DAY, MONTH 0] / [0:00 PM] / [ROOM] / [ATTIRE]
         with the next event on the schedule.
      5. ✎ Button links to the public rush schedule. Confirm the page is live.

    BUILD RULES (do not undo)
      - Purple bands are baked PNGs. Never put live text on a purple cell.
      - Every cream td carries bgcolor AND background-color, and every text div
        sets its own color, so dark mode cannot leave dark text on a dark panel.
      - Visible placeholders are BRACKETED CAPS. The pencil mark belongs in these
        comments only, never in a text node.
      - Body copy capped at 70 words. This build uses 24, plus 11 in the detail
        card. Keep it there.
      - No em dashes. No advice. No invented numbers.
  -->
</head>
