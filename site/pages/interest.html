<section class="interest-intake" id="interest" aria-labelledby="interest-title">
  <div class="wrap interest-sheet">
    <header class="interest-intro">
      <h1 id="interest-title">Rush interest form</h1>
      <p>Leave your name and email to get the next Rush schedule and event details from Phi Chi Theta at USF.</p>
      <a class="text-link interest-back" href="/rush">Back to Rush</a>
    </header>
    <div class="interest-panel">
      <form class="interest-form" data-interest method="post" action="/api/interest">
        <input type="hidden" name="source" value="rush">
        <div class="form-field"><label for="interest-name">Full name</label><input id="interest-name" name="name" autocomplete="name" minlength="2" maxlength="120" required></div>
        <div class="form-field"><label for="interest-email">Email address</label><input id="interest-email" name="email" type="email" autocomplete="email" maxlength="254" required></div>
        <div class="form-field"><label for="interest-major">Major or minor <span class="field-optional">(optional)</span></label><input id="interest-major" name="major" autocomplete="off" maxlength="120"></div>
        <div class="form-field"><label for="interest-graduation">Graduation year <span class="field-optional">(optional)</span></label><input id="interest-graduation" name="graduationYear" inputmode="numeric" type="number" min="2026" max="2100" step="1"></div>
        <div class="form-honeypot" aria-hidden="true"><label for="interest-website">Website</label><input id="interest-website" name="website" tabindex="-1" autocomplete="off"></div>
        <label class="form-consent"><input id="interest-consent" name="consent" type="checkbox" value="true" required><span>I agree to be contacted by Phi Chi Theta at USF about recruitment.</span></label>
        <button class="button" type="submit">Join the interest list</button>
        <p data-form-status role="status" aria-live="polite"></p>
      </form>
      <noscript>
        <style>.interest-form[data-interest]{display:none}</style>
        <p>Contact the recruitment team at <a class="text-link" href="https://www.instagram.com/pctusf/">@pctusf</a> for the next Rush schedule.</p>
      </noscript>
      <div class="signup-confirmation" data-signup-confirmation role="group" aria-labelledby="confirmation-title" tabindex="-1" hidden>
        <h2 id="confirmation-title">You’re on the Rush interest list.</h2>
        <p>The recruitment team can now send you the next Rush schedule and event details.</p>
        <a class="text-link" href="/about#recruitment-chair">Meet the VP of Recruitment</a>
      </div>
    </div>
  </div>
</section>
