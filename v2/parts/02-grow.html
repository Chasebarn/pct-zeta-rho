<!-- Membership: one open accordion panel and its photograph.
     Without JavaScript, every description and photograph remains visible. -->
<section class="grow" id="grow" data-grow aria-label="Membership">
  <div class="v2wrap grow__wrap">

    <div class="grow__stage" data-grow-stage></div>

    <div class="grow__rows" data-grow-rows role="group" aria-label="The three parts of the chapter">

      <div class="grow__row">
        <h2 class="grow__rowh">
          <button class="grow__btn" type="button" id="grow-b1" data-grow-btn data-grow-figure="grow-f1" aria-controls="grow-p1" aria-expanded="true">
            <span class="grow__ttl">Professional Connections</span>
            <span class="grow__icon" aria-hidden="true"></span>
          </button>
        </h2>
        <div class="grow__panel" id="grow-p1" role="region" aria-labelledby="grow-b1">
          <p class="grow__say">Meet professionals, alumni, and fellow members through the chapter.</p>
        </div>
        <figure class="grow__fig" id="grow-f1" aria-labelledby="grow-b1">
          <img src="assets/photo-letters.jpg" width="1300" height="1300" loading="lazy" decoding="async"
               alt="Members in chapter Fall Rush shirts working around a table.">
        </figure>
      </div>

      <div class="grow__row">
        <h2 class="grow__rowh">
          <button class="grow__btn" type="button" id="grow-b2" data-grow-btn data-grow-figure="grow-f2" aria-controls="grow-p2" aria-expanded="true">
            <span class="grow__ttl">Leadership Experience</span>
            <span class="grow__icon" aria-hidden="true"></span>
          </button>
        </h2>
        <div class="grow__panel" id="grow-p2" role="region" aria-labelledby="grow-b2">
          <p class="grow__say">Plan events, lead projects, and take responsibility for chapter initiatives.</p>
        </div>
        <figure class="grow__fig" id="grow-f2" aria-labelledby="grow-b2">
          <img src="assets/photo-service.jpg" width="1300" height="1300" loading="lazy" decoding="async"
               alt="Three members in chapter shirts loading roof shingles onto a utility vehicle at a service project.">
        </figure>
      </div>

      <div class="grow__row">
        <h2 class="grow__rowh">
          <button class="grow__btn" type="button" id="grow-b3" data-grow-btn data-grow-figure="grow-f3" aria-controls="grow-p3" aria-expanded="true">
            <span class="grow__ttl">Chapter Community</span>
            <span class="grow__icon" aria-hidden="true"></span>
          </button>
        </h2>
        <div class="grow__panel" id="grow-p3" role="region" aria-labelledby="grow-b3">
          <p class="grow__say">Take part in Formal, Retreat, intramurals, and everyday chapter life.</p>
        </div>
        <figure class="grow__fig" id="grow-f3" aria-labelledby="grow-b3">
          <img src="assets/photo-fundraiser.jpg" width="1300" height="1300" loading="lazy" decoding="async"
               alt="A member holding a hand lettered Pie a Phi Chi sign at a campus fundraiser for Moffitt Cancer Center.">
        </figure>
      </div>

    </div>
  </div>
</section>
