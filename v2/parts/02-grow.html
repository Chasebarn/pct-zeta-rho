<!-- Membership retains one open panel and photo selection. On narrow screens,
     each photo stays with its category; the desktop view uses a shared stage.
     Without JavaScript, every description and photograph remains visible. -->
<section class="grow" id="grow" data-grow aria-label="Membership">
  <div class="v2wrap grow__wrap">

    <div class="grow__rows" data-grow-rows role="group" aria-label="The three parts of the chapter">

      <div class="grow__row">
        <h2 class="grow__rowh">
          <button class="grow__btn" type="button" id="grow-b1" data-grow-btn data-grow-figure="grow-f1" aria-controls="grow-p1" aria-expanded="true">
            <span class="grow__ttl">Professional Connections</span>
            <span class="grow__icon" aria-hidden="true"></span>
          </button>
        </h2>
        <div class="grow__panel" id="grow-p1" role="region" aria-labelledby="grow-b1">
          <p class="grow__say">Connect with members, alumni, and professionals through chapter events.</p>
          <figure class="grow__fig grow__fig--framed" id="grow-f1" aria-labelledby="grow-b1">
            <img src="assets/chapter-members.jpg" width="720" height="720" loading="lazy" decoding="async"
                 alt="Four chapter members in professional attire at a chapter event.">
          </figure>
        </div>
      </div>

      <div class="grow__row">
        <h2 class="grow__rowh">
          <button class="grow__btn" type="button" id="grow-b2" data-grow-btn data-grow-figure="grow-f2" aria-controls="grow-p2" aria-expanded="true">
            <span class="grow__ttl">Leadership Experience</span>
            <span class="grow__icon" aria-hidden="true"></span>
          </button>
        </h2>
        <div class="grow__panel" id="grow-p2" role="region" aria-labelledby="grow-b2">
          <p class="grow__say">Organize events, lead projects, and take responsibility in the chapter.</p>
          <figure class="grow__fig grow__fig--framed" id="grow-f2" aria-labelledby="grow-b2">
            <img src="assets/chapter-careers.jpg" width="720" height="717" loading="lazy" decoding="async"
                 alt="Chapter members talking and working together around a table with laptops.">
          </figure>
        </div>
      </div>

      <div class="grow__row">
        <h2 class="grow__rowh">
          <button class="grow__btn" type="button" id="grow-b3" data-grow-btn data-grow-figure="grow-f3" aria-controls="grow-p3" aria-expanded="true">
            <span class="grow__ttl">Chapter Community</span>
            <span class="grow__icon" aria-hidden="true"></span>
          </button>
        </h2>
        <div class="grow__panel" id="grow-p3" role="region" aria-labelledby="grow-b3">
          <p class="grow__say">Formal, Retreat, intramurals, and service with the chapter.</p>
          <figure class="grow__fig grow__fig--framed" id="grow-f3" aria-labelledby="grow-b3">
            <img src="assets/chapter-community.jpg" width="720" height="720" loading="lazy" decoding="async"
                 alt="A group of chapter members together at an evening event.">
          </figure>
        </div>
      </div>

    </div>

    <div class="grow__stage" data-grow-stage></div>
  </div>
</section>
