<!-- 02 — Graduate confident.  Signature interaction: the image accordion.
     Base markup below is the finished, JS-free state: all three rows open,
     each with its photograph beneath it. JS moves the <figure>s (the very same
     nodes, so nothing is downloaded twice) into the persistent stage. -->
<section class="grow" id="grow" data-grow aria-labelledby="grow-title">
  <div class="v2wrap grow__wrap">

    <div class="grow__intro">
      <h2 class="grow__h" id="grow-title">Graduate <em>confident.</em></h2>
      <p class="grow__lede">Four years of practice before it counts. You leave with a resume that holds up, a record of leading real work, and people who answer.</p>
    </div>

    <div class="grow__stage" data-grow-stage>
      <span class="grow__mat" aria-hidden="true"></span>
    </div>

    <div class="grow__rows" data-grow-rows role="group" aria-label="What membership builds">
      <span class="grow__rail" data-grow-fill aria-hidden="true"></span>

      <div class="grow__row">
        <h3 class="grow__rowh">
          <button class="grow__btn" type="button" id="grow-b1" data-grow-btn aria-controls="grow-f1" aria-expanded="true">
            <span class="grow__num" aria-hidden="true">01</span>
            <span class="grow__ttl">Build Your Career</span>
          </button>
        </h3>
        <figure class="grow__fig" id="grow-f1" aria-labelledby="grow-b1">
          <div class="grow__frame">
            <img src="assets/ph/career-1.png" width="1000" height="1250" loading="lazy" decoding="async"
                 alt="A member marking up a printed resume with an alumnus at a chapter career night.">
          </div>
          <figcaption class="grow__cap">
            <span class="grow__kick">Resume lab &middot; Muma College of Business</span>
            <span class="grow__body">Resume work, interview practice, and speakers who actually hire.</span>
          </figcaption>
        </figure>
      </div>

      <div class="grow__row">
        <h3 class="grow__rowh">
          <button class="grow__btn" type="button" id="grow-b2" data-grow-btn aria-controls="grow-f2" aria-expanded="true">
            <span class="grow__num" aria-hidden="true">02</span>
            <span class="grow__ttl">Lead Before You Graduate</span>
          </button>
        </h3>
        <figure class="grow__fig" id="grow-f2" aria-labelledby="grow-b2">
          <div class="grow__frame">
            <img src="assets/ph/leadership-1.png" width="1000" height="1250" loading="lazy" decoding="async"
                 alt="A member running a chapter meeting from the front of the room.">
          </div>
          <figcaption class="grow__cap">
            <span class="grow__kick">Chapter meeting &middot; Marshall Student Center</span>
            <span class="grow__body">Members run the projects, the budgets and the volunteer days themselves.</span>
          </figcaption>
        </figure>
      </div>

      <div class="grow__row">
        <h3 class="grow__rowh">
          <button class="grow__btn" type="button" id="grow-b3" data-grow-btn aria-controls="grow-f3" aria-expanded="true">
            <span class="grow__num" aria-hidden="true">03</span>
            <span class="grow__ttl">Find Your People</span>
          </button>
        </h3>
        <figure class="grow__fig grow__fig--burst" id="grow-f3" aria-labelledby="grow-b3">
          <div class="grow__frame grow__frame--burst">
            <div class="grow__poly">
              <img src="assets/ph/poly-1.png" width="700" height="700" loading="lazy" decoding="async"
                   alt="Members in formal dress at the spring banquet.">
              <span class="grow__polycap">Formal</span>
            </div>
            <div class="grow__poly">
              <img src="assets/ph/poly-2.png" width="700" height="700" loading="lazy" decoding="async"
                   alt="The chapter together on the annual retreat.">
              <span class="grow__polycap">Retreat</span>
            </div>
            <div class="grow__poly">
              <img src="assets/ph/poly-3.png" width="700" height="700" loading="lazy" decoding="async"
                   alt="An intramural team huddled after a game.">
              <span class="grow__polycap">Intramurals</span>
            </div>
            <div class="grow__poly">
              <img src="assets/ph/poly-4.png" width="700" height="700" loading="lazy" decoding="async"
                   alt="Members painting at a Tampa service day.">
              <span class="grow__polycap">Service day</span>
            </div>
            <div class="grow__poly">
              <img src="assets/ph/poly-5.png" width="700" height="700" loading="lazy" decoding="async"
                   alt="New members on bid night.">
              <span class="grow__polycap">Bid night</span>
            </div>
          </div>
          <figcaption class="grow__cap">
            <span class="grow__kick">Formal, retreat, intramurals &middot; Tampa</span>
            <span class="grow__body">The people who prepare with you, refer you, and vouch for you later.</span>
          </figcaption>
        </figure>
      </div>

    </div>
  </div>
</section>
