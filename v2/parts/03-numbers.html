<!-- ============================================================
     03 — Numbers don’t lie.   Communication method: SCALE.

     ONE signature interaction: the PINNED HORIZONTAL SCROLL (>=768px).
     The markup below IS the finished state. With JavaScript disabled, on a
     phone, or under prefers-reduced-motion it reads as a plain vertical
     sequence of three monumental statistics — nothing here is hidden and
     nothing waits on script.

     ONLY TWO OF THESE STATISTICS ARE VERIFIED (95%, 3.60). See stat 03.
     The values are mirrored in the STATS array at the top of 03-numbers.js;
     edit both, or the console will warn that they have drifted apart.
     ============================================================ -->
<section class="num" id="numbers" data-num data-pct-stage="proof" aria-labelledby="num-h">
  <div class="numscene" data-num-scene>
    <div class="numpin" data-num-pin>

      <div class="num__head">
        <h2 class="num__h" id="num-h">Numbers don’t <em>lie.</em></h2>
      </div>

      <ol class="numtrack" data-num-track role="list">

        <!-- STAT 01 — verified -->
        <li class="num__p" data-num-p>
          <span class="num__ord" aria-hidden="true">01</span>
          <p class="num__val"><span data-num-n>95</span><span class="num__u" data-num-u>%</span></p>
          <p class="num__lab" data-num-lab>Members placed in internships or full-time roles</p>
        </li>

        <!-- STAT 02 — verified -->
        <li class="num__p" data-num-p>
          <span class="num__ord" aria-hidden="true">02</span>
          <p class="num__val"><span data-num-n>3.60</span><span class="num__u" data-num-u></span></p>
          <p class="num__lab" data-num-lab>Chapter average GPA</p>
        </li>

        <!-- STAT 03 — NOT VERIFIED.
             this is a placeholder, the owner must supply a verified metric, do not publish invented data
             It renders as a real panel so the layout is final. To fill it in, edit
             STATS[2] in 03-numbers.js and mirror the same value + label here. -->
        <li class="num__p" data-num-p data-placeholder>
          <span class="num__ord" aria-hidden="true">03</span>
          <p class="num__val" aria-hidden="true"><span data-num-n>&mdash;</span><span class="num__u" data-num-u></span></p>
          <p class="num__lab" data-num-lab>Verified metric to be confirmed</p>
        </li>

      </ol>

    </div>
  </div>
</section>
