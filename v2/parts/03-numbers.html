<!-- ============================================================
     03 — Numbers don’t lie.   Communication method: SCALE.

     No pinned horizontal scroll. Three statistics do not need 300vh of
     hijacked scrolling to be read, and an earlier build spent it anyway:
     the scene ran long, delivered little, and took the reader's scroll
     away to do it. This is now one centred composition that resolves in
     a single screen.

     ALL THREE VALUES ARE VERIFIED and match the live site (index.html).
     They are mirrored in the STATS array at the top of 03-numbers.js;
     edit both, or the console warns that they have drifted apart.
     ============================================================ -->
<section class="num" id="numbers" data-num aria-labelledby="num-h">
  <div class="v2wrap">

    <h2 class="num__h" id="num-h">Numbers don’t <em>lie.</em></h2>

    <ol class="num__grid" role="list">

      <li class="num__p" data-num-p>
        <p class="num__val"><span data-num-n>95</span><span class="num__u" data-num-u>%</span></p>
        <p class="num__lab" data-num-lab>Members placed in internships or full-time roles</p>
      </li>

      <li class="num__p" data-num-p>
        <p class="num__val"><span data-num-n>3.60</span><span class="num__u" data-num-u></span></p>
        <p class="num__lab" data-num-lab>Chapter average GPA</p>
      </li>

      <li class="num__p" data-num-p>
        <p class="num__val"><span data-num-n>15</span><span class="num__u" data-num-u></span></p>
        <p class="num__lab" data-num-lab>“25 Under 25” honorees</p>
      </li>

    </ol>

  </div>
</section>
