<!-- Existing member destinations use authentic local logo artwork.
     Source provenance is recorded in assets/logos/sources.json. -->

          <p class="pl-n-val">
            <span class="pl-stat-label">95%</span>

          </p>
          <p class="pl-n-lab">USF Muma “25 Under 25” honorees</p>
