<!-- ============================================================
     04 · EXPERIENCE — "PCT in real life."
     Register shift: the proof band was typographic and controlled;
     this is dark, and it is suddenly people everywhere.

     Signature interaction: a 3D photo rail. The markup below is the
     FINISHED state with no JS: a native scroll-snap strip, all eight
     photographs reachable, every caption visible. 04-life.js only
     lifts that same strip into a perspective depth field.

     PHOTO DIRECTION FOR THE REAL SHOOT — keep the register mixed.
     Roughly half of these should be properly lit, composed
     photography (formal, summit, guest speaker, chapter portrait).
     The other half must be iPhone candids (retreat, intramurals,
     beach day, service day) — slightly off-level, someone laughing
     out of frame. If all eight look art-directed the rail stops
     reading as a real chapter and starts reading as stock. Keep the
     aspect ratios mixed too: a couple of vertical phone shots
     among the landscapes, exactly as below.
     ============================================================ -->
<section class="life on-dark" id="life" aria-labelledby="life-h">
  <div class="v2wrap life-head">
    <p class="v2-label life-label">Chapter life</p>
    <h2 class="life-h" id="life-h">PCT in real life.</h2>
    <p class="life-lede">One academic year in eight photographs.</p>
  </div>

  <div class="life-rail" data-life-rail>
    <div class="life-stage"
         data-life-stage
         tabindex="0"
         role="group"
         aria-label="Chapter photographs. Use the left and right arrow keys to move through them.">
      <ul class="life-track" data-life-track role="list">

        <li class="life-card is-tall" id="life-c1">
          <figure class="life-figure">
            <div class="life-media">
              <img src="assets/ph/rail-formal.png" width="1200" height="800"
                   loading="lazy" decoding="async"
                   alt="Chapter members in formalwear at the fall formal.">
            </div>
            <figcaption class="life-cap">Fall Formal</figcaption>
          </figure>
        </li>

        <li class="life-card" id="life-c2">
          <figure class="life-figure">
            <div class="life-media">
              <img src="assets/ph/rail-retreat.png" width="1200" height="800"
                   loading="lazy" decoding="async"
                   alt="Members outdoors together on the spring retreat.">
            </div>
            <figcaption class="life-cap">Spring Retreat</figcaption>
          </figure>
        </li>

        <li class="life-card" id="life-c3">
          <figure class="life-figure">

              <img src="assets/ph/rail-summit.png" width="1200" height="800"

          </figure>
        </li>

        <li class="life-card" id="life-c4">

        <li class="life-card is-tall" id="life-c5">

        <li class="life-card" id="life-c6">
