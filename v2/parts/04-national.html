<!-- Map pins are generated from the national chapter directory and federal
     NCES campus coordinates. Geometry and sources are kept in assets/map/. -->
<section class="v2nat on-dark" id="national" aria-labelledby="v2nat-h" data-national>
  <div class="v2wrap">
    <div class="v2nat-lock">
      <img class="v2nat-crest" src="assets/crest.png" width="337" height="445" loading="lazy" decoding="async" alt="Phi Chi Theta crest">
      <h2 class="v2nat-h" id="v2nat-h">A national fraternity since <em>1924.</em></h2>
    </div>
    <div class="v2nat-layout">
      <div class="v2nat-copy">
        <p class="v2nat-scale"><span class="v2nat-number">{{PCT_CHAPTER_COUNT}}</span><span class="v2nat-number-label">Collegiate chapters</span></p>
        <p class="v2nat-say">Zeta Rho at USF is part of a national professional fraternity for business and economics.</p>
        <a class="v2nat-link" href="https://www.phichitheta.org/find-a-chapter" target="_blank" rel="noopener">National chapter directory</a>
      </div>
      <figure class="v2nat-figure">
        <!-- PCT_CHAPTER_MAP -->
        <figcaption class="v2nat-map-footer">
          <div class="v2nat-controls" data-map-controls hidden>
            <label class="v2-sr-only" for="pct-university">Choose a collegiate chapter</label>
            <select class="v2nat-select" id="pct-university" data-map-select>
              <!-- PCT_CHAPTER_OPTIONS -->
            </select>
            <p class="v2nat-location" data-map-location aria-live="polite">Zeta Rho · Tampa, FL</p>
          </div>
          <span class="v2nat-legend"><span aria-hidden="true"></span> Collegiate chapters · USF highlighted</span>
        </figcaption>
      </figure>
    </div>
  </div>
</section>
