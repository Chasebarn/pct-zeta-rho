<!-- 05 - College should look like this.
     A WHEEL. The photographs sit on a circle whose centre is below the section,
     each rotated to its own angular position so it points radially outward. Bottom
     corners OVERLAP their neighbours, tops splay apart, and the arc is deep enough
     to read as a curve rather than a line.

     15 slots around a full circle, filled by five photographs on repeat. A whole
     circle means one revolution returns to the identical frame, so the spin has no
     loop point anywhere. 15 divides by 5, so the wrap never doubles a frame.

     Three of the five photographs are real. Replace assets/mem/m2 and m5. -->
