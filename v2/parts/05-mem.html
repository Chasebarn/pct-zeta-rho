<!-- 05 - Your college should look like this.
     A WHEEL, not a strip. The photographs sit on a circle whose centre is far below
     the section, each one rotated to its own angular position so it points radially
     outward. That is what makes their bottom corners touch while their tops splay
     apart, and it is why the whole thing reads as spinning rather than sliding.

     36 slots around a full circle, filled by six photographs on repeat. Because it
     is a complete circle, one revolution returns to the identical frame, so the spin
     has no loop point and no seam anywhere.

     The band clips the top of the wheel, so the bottoms are cut flat by the section
     below and the arc is what you see. Geometry is derived in 05-mem.css.

     Two of the six photographs are real. Replace assets/mem/m1, m2, m5, m6. -->
