<!-- 05 - College should look like this.
     A WHEEL. Each photograph sits on a circle whose centre is below the section and
     is rotated to its own angular position, so it points radially outward. The card
     nearest each edge of the viewport is tilted about 23 degrees off vertical, which
     is what makes the row read as an arc rather than a slideshow.

     44 slots around a full circle, four photographs on repeat. A whole circle means
     one revolution returns to the identical frame, so there is no loop point. 44
     divides by 4, so the wrap never doubles a frame.

     THREE OF THE FOUR PHOTOGRAPHS ARE REAL. Replace assets/mem/m2 and the section
     is entirely real. -->
